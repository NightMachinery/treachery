<div
  matRipple
  [ngClass]="[
    active ? 'selected' : 'not-selected',
    subdued ? 'subdued' : '',
    means ? 'means' : 'clue',
    (textOnlyMode$ | async) || shouldShowTextOnly ? 'text-only' : 'image-card',
  ]"
  class="card"
  [ngStyle]="cardAspectRatioStyle"
  [class.mat-elevation-z2]="true"
>
  <ng-container *ngIf="(textOnlyMode$ | async) || shouldShowTextOnly; else imageMode">
    <div class="text-only-body" dir="auto">
      <div #cardName class="card-name" [class.card-name--compressed]="labelCompressed" dir="auto">{{ card.name }}</div>
    </div>
  </ng-container>

  <ng-template #imageMode>
    <div class="image-container">
      <img class="main-img" [src]="card.imgUrl" [alt]="card.name" loading="lazy" (error)="onImageError($event)" />
    </div>
    <div #cardName class="card-name" [class.card-name--compressed]="labelCompressed" dir="auto">{{ card.name }}</div>
  </ng-template>
</div>
