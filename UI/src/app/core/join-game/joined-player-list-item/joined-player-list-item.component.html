<div class="player-card surface-panel--soft">
  <div class="img-container">
    <tg-avatar [uid]="participant.uid" [name]="participant.name"></tg-avatar>
  </div>

  <div class="player-copy">
    <div class="name-row">
      <span class="name">{{ participant.name }}</span>
      <span class="role-label">{{ participant.role === 'observer' ? 'Observer' : 'Player' }}</span>
    </div>

    <span class="badges">
      <span class="badge creator" *ngIf="participant.isCreator">mod</span>
      <span class="badge scientist" *ngIf="participant.isScientist">scientist</span>
      <span class="badge marked" *ngIf="participant.isMarkedScientist && !participant.isScientist">marked</span>
      <span class="badge bot" *ngIf="participant.isBot">bot</span>
    </span>
  </div>
</div>
