<div *ngIf="gameApi.participants$ | async as participants" class="container">
  <div class="header-row">
    <div>
      <p class="eyebrow">Players</p>
      <div class="title">Room Participants</div>
    </div>
    <div class="count">{{ participants.length }} total</div>
  </div>

  <div class="participants" *ngIf="participants.length > 0; else emptyState">
    <div *ngFor="let participant of participants" class="participant-card">
      <app-joined-player-list-item [participant]="participant"></app-joined-player-list-item>
      <div class="controls" *ngIf="showModControls && (gameApi.viewer$ | async)?.isCreator && !(gameApi.game$ | async)?.startedOn">
        <button mat-stroked-button type="button" (click)="toggleRole(participant)">
          {{ participant.role === 'player' ? 'Make observer' : 'Make player' }}
        </button>
        <button mat-stroked-button type="button" *ngIf="participant.role === 'player'" (click)="toggleScientist(participant)">
          {{ participant.isMarkedScientist ? 'Unmark scientist' : 'Mark scientist' }}
        </button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state surface-panel--soft">No participants yet. Share the invite link to fill the room.</div>
  </ng-template>
</div>
