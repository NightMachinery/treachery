<ng-container *ngIf="gameApi.participantsDict$ | async as participantsDict">
  <ng-container *ngIf="gameApi.game$ | async as game">
    <ng-container *ngIf="gameApi.viewer$ | async as viewer">
      <div class="container" *ngIf="!chatApi.collapsed; else collapsed">
        <div class="title-bar">
          <div>
            <div class="eyebrow">Table talk</div>
            <div class="chat-title">Chat</div>
          </div>
          <button mat-icon-button class="close-button" (click)="chatApi.toggleCollapse(true)" aria-label="Close chat">×</button>
        </div>

        <div class="messages" #messages>
          <ng-container *ngFor="let message of chatApi.messages$ | async">
            <div class="message-container" [class.mine]="mine(message, viewer.uid)">
              <div class="image-container" *ngIf="!mine(message, viewer.uid)">
                <tg-avatar [uid]="message.playerUid || game.scientistUid || game.creatorUid"></tg-avatar>
              </div>

              <div class="message-card">
                <div class="info">
                  <div class="name">
                    <ng-container *ngIf="message.playerUid && participantsDict.get(message.playerUid) as participant; else forensic">
                      {{ participant.name }}
                    </ng-container>
                    <ng-template #forensic>System</ng-template>
                  </div>
                </div>
                <div class="message">{{ message.message }}</div>
              </div>

              <div class="image-container" *ngIf="mine(message, viewer.uid)">
                <tg-avatar [uid]="viewer.uid"></tg-avatar>
              </div>
            </div>
          </ng-container>
        </div>

        <div class="input">
          <label class="message-field">
            <span class="sr-only">Message</span>
            <input
              name="message"
              [disabled]="disableChat"
              [placeholder]="disableChat ? 'Chat is disabled for this role' : 'Type a message'"
              (keyup.enter)="sendMessage()"
              [(ngModel)]="message"
              #messageInput
            />
          </label>
          <button
            mat-raised-button
            [disabled]="disableChat || !message || !message.trim()"
            color="accent"
            autocomplete="off"
            (click)="sendMessage()"
          >
            Send
          </button>
        </div>
      </div>

      <ng-template #collapsed>
        <button mat-icon-button (click)="chatApi.toggleCollapse(false)" class="collapsed-chat-button" aria-label="Open chat">💬</button>
      </ng-template>
    </ng-container>
  </ng-container>
</ng-container>
