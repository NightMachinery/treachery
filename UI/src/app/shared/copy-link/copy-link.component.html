<div matRipple class="copy-container" (click)="copyText()">
  <div class="copy-input">
    <span class="copy-label">Invite link</span>
    <input #copyInput [value]="text" readonly />
  </div>
  <button mat-stroked-button type="button" (click)="$event.stopPropagation(); copyText()">Copy link</button>
</div>
