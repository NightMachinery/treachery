<div class="app-navbar">
  <div class="title">Treachery</div>
  <div class="identity" *ngIf="identity$ | async as identity; else showLoading">
    <div class="name">{{ identity.name }}</div>
    <button mat-button type="button" (click)="rename()">Rename</button>
    <div class="avatar-container">
      <tg-avatar [diameter]="50" [uid]="identity.uid"></tg-avatar>
    </div>
  </div>
  <ng-template #showLoading>
    <div class="avatar-container">
      <mat-spinner [diameter]="50" color="accent"></mat-spinner>
    </div>
  </ng-template>
</div>
