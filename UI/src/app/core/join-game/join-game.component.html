<div *ngIf="!loading && !missingGame && (gameApi.game$ | async) as game; else fallback" class="root-container">
  <div class="join-container">
    <div class="heading-container">
      <h2>Game ID: {{ gameApi.gameId$ | async }}</h2>
      <tg-copy-link [text]="gameApi.joinLink$ | async"></tg-copy-link>
      <button mat-stroked-button type="button" *ngIf="(gameApi.viewer$ | async)?.isParticipant" (click)="copyMigrateLink()">
        Migrate device
      </button>
    </div>

    <ng-container *ngIf="gameApi.viewer$ | async as viewer">
      <ng-container *ngIf="!game.startedOn; else startedBlock">
        <div class="flex-horizontal" *ngIf="!viewer.isParticipant; else joinedInfo">
          <div class="button-container">
            <button mat-raised-button color="accent" (click)="joinAsPlayer()">Join lobby</button>
          </div>
        </div>
        <ng-template #joinedInfo>
          <tg-info>
            {{ viewer.isCreator ? 'You are the room moderator and a lobby player.' : 'You are in the lobby.' }}
          </tg-info>
        </ng-template>

        <div class="settings-panel" *ngIf="viewer.isCreator">
          <h3>Lobby settings</h3>
          <div class="settings-grid">
            <label>
              <span>Means cards / suspect</span>
              <input type="number" min="1" [(ngModel)]="settings.meansCardsPerPlayer" (ngModelChange)="handleMeansCardCountChange()" />
            </label>
            <label>
              <span>Evidence cards / suspect</span>
              <input
                type="number"
                min="1"
                [disabled]="settings.linkClueCountToMeans"
                [(ngModel)]="settings.clueCardsPerPlayer"
                (ngModelChange)="handleClueCardCountChange()"
              />
            </label>
            <label class="checkbox-row wide">
              <input type="checkbox" [(ngModel)]="settings.linkClueCountToMeans" (ngModelChange)="handleLinkClueCountChange()" />
              <span>Evidence count just follows means count</span>
            </label>
            <label class="checkbox-row wide">
              <input type="checkbox" [(ngModel)]="settings.meansCluesTextOnly" (ngModelChange)="handleMeansCluesTextOnlyChange()" />
              <span>Means/clues text only (hide images)</span>
            </label>
            <label>
              <span>Accomplices</span>
              <input type="number" min="0" max="10" [(ngModel)]="settings.accompliceCount" (ngModelChange)="handleRoleCountChange()" />
            </label>
            <label>
              <span>Witnesses</span>
              <input type="number" min="0" max="10" [(ngModel)]="settings.witnessCount" (ngModelChange)="handleRoleCountChange()" />
            </label>
            <label *ngIf="settings.witnessCount > 0">
              <span>Witnesses murderer must find</span>
              <input type="number" min="1" [max]="settings.witnessCount" [(ngModel)]="settings.witnessesToFind" (ngModelChange)="handleRoleCountChange()" />
            </label>
          </div>
          <div class="settings-actions">
            <button mat-stroked-button type="button" (click)="resetSettings(game)" [disabled]="!settingsDirty">Reset</button>
            <button mat-raised-button color="accent" type="button" (click)="saveSettings()" [disabled]="!settingsDirty">Save settings</button>
          </div>
          <tg-info *ngIf="getStartValidationMessage(game, (gameApi.participants$ | async) || []) as validation" [hidden]="!validation">
            {{ validation }}
          </tg-info>
        </div>

        <div class="joined-list-container">
          <app-joined-players-list [showModControls]="viewer.isCreator"></app-joined-players-list>
        </div>

        <div class="start-button-container" *ngIf="viewer.isCreator">
          <button
            mat-raised-button
            color="accent"
            (click)="startGame()"
            [disabled]="!!getStartValidationMessage(game, (gameApi.participants$ | async) || []) || settingsDirty"
          >
            {{ settingsDirty ? 'Save settings to start' : 'Start Game' }}
          </button>
        </div>
      </ng-container>

      <ng-template #startedBlock>
        <tg-info *ngIf="!viewer.isParticipant">This game already started. Observe it in read-only mode.</tg-info>
        <div class="button-container" *ngIf="!viewer.isParticipant">
          <button mat-raised-button color="accent" (click)="observeStartedGame()">Observe game</button>
        </div>
      </ng-template>
    </ng-container>
  </div>
</div>

<ng-template #fallback>
  <ng-container *ngIf="loading; else missing">
    <div class="flex-vertical">
      <mat-spinner></mat-spinner>
    </div>
  </ng-container>
</ng-template>

<ng-template #missing>
  <tg-info class="no-such-game">
    No such game, <a mat-raised-button color="accent" [routerLink]="['/']">Go back home</a> to create one?
  </tg-info>
</ng-template>
