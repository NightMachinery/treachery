<div class="dialog-shell" [class.danger]="data.variant === 'danger'">
  <div class="eyebrow">Confirm action</div>
  <h2>{{ data.title }}</h2>
  <p>{{ data.message }}</p>

  <div class="dialog-actions">
    <button mat-stroked-button type="button" (click)="cancel()">{{ data.cancelLabel }}</button>
    <button mat-raised-button type="button" [color]="data.variant === 'danger' ? 'warn' : 'accent'" (click)="confirm()" cdkFocusInitial>
      {{ data.confirmLabel }}
    </button>
  </div>
</div>
