<div class="card">
  <div class="img-container">
    <tg-avatar [uid]="participant.uid"></tg-avatar>
  </div>
  <app-ripple-mat-card>
    <div class="name-row">
      <span>{{ participant.name }}</span>
      <span class="badges">
        <span class="badge creator" *ngIf="participant.isCreator">mod</span>
        <span class="badge scientist" *ngIf="participant.isScientist">scientist</span>
        <span class="badge marked" *ngIf="participant.isMarkedScientist && !participant.isScientist">marked</span>
        <span class="badge observer" *ngIf="participant.role === 'observer'">observer</span>
      </span>
    </div>
  </app-ripple-mat-card>
</div>
