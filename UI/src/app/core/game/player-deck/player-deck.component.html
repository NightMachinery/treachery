<div class="player-deck" [class.deck-selected]="deckSelected" [class.deck-dimmed]="deckDimmed">
  <div class="player">
    <div class="avatar-container"><tg-avatar [uid]="player.uid" [name]="player.name"></tg-avatar></div>
    <div>
      <div class="name">{{ player.name }}</div>
      <div class="subtitle">Suspect cards</div>
    </div>
  </div>

  <div class="card-lane means-lane">
    <div class="cards">
      <app-card
        *ngFor="let card of player.meansCards; trackBy: trackByCardName"
        [card]="card"
        [active]="!disableSelectionDisplay && selectedMeans === card.name"
        [subdued]="shouldSubdueMeans(card.name)"
        [means]="true"
        (click)="!disableSelection && meansClick(card.name)"
      ></app-card>
    </div>
  </div>

  <div class="card-lane clue-lane">
    <div class="cards">
      <app-card
        *ngFor="let card of player.clueCards; trackBy: trackByCardName"
        [card]="card"
        [active]="!disableSelectionDisplay && selectedClue === card.name"
        [subdued]="shouldSubdueClue(card.name)"
        [means]="false"
        (click)="!disableSelection && clueClick(card.name)"
      ></app-card>
    </div>
  </div>
</div>
