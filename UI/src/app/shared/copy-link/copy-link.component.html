 <div class="copy-container">
   <input #copyInput [value]="text" readonly style="position: absolute; left: -9999px;" />
   <button 
     mat-raised-button 
     color="accent"
     type="button" 
     class="copy-button"
     [class.copied]="copied"
     (click)="copyText()"
   >
     <span class="button-content">
       <span class="icon" [class.show]="!copied">📋</span>
       <span class="icon checkmark" [class.show]="copied">✓</span>
       <span class="label">{{ copied ? 'Copied!' : 'Copy invite link' }}</span>
     </span>
   </button>
 </div>
