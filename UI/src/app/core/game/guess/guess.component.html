<div class="wrapper surface-panel--soft" *ngIf="guess && guess.murdererUid">
  <div class="guess-copy">
    <p class="eyebrow">Accusation</p>
    <h3>Compose a guess</h3>
    <p class="muted-copy">Select a suspect, then pick one means card and one clue card from that same deck.</p>
  </div>

  <div class="container">
    <ng-container *ngIf="gameApi.players$ | async as players">
      <ng-container *ngIf="getMurderer(players) as murderer">
        <div class="murderer">
          <div class="think">I think</div>
          <tg-avatar [diameter]="52" [uid]="murderer.uid"></tg-avatar>
          <div class="name">{{ murderer.name }}</div>
          <div class="subtitle">is the murderer</div>
        </div>
        <ng-container *ngIf="getMeansCard(murderer) as meansCard">
          <app-card [card]="meansCard" [means]="true"></app-card>
          <ng-container *ngIf="getClueCard(murderer) as clueCard">
            <app-card [card]="clueCard" [means]="false"></app-card>
            <div class="button-container">
              <button mat-raised-button color="accent" (click)="makeGuess()">Make guess</button>
            </div>
          </ng-container>
        </ng-container>
      </ng-container>
    </ng-container>
  </div>
</div>
