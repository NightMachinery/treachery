<div matRipple class="copy-container" (click)="copyText()">
  <div class="copy-input">
    <mat-form-field class="example-full-width">
      <mat-label>Invite friends with this url</mat-label>
      <input #copyInput matInput [value]="text" readonly />
    </mat-form-field>
  </div>
  <button mat-button type="button" (click)="$event.stopPropagation(); copyText()">Copy</button>
</div>
