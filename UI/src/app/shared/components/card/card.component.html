<div
  matRipple
  [ngClass]="[
    active ? 'selected' : 'not-selected',
    subdued ? 'subdued' : '',
    means ? 'means' : 'clue',
    (textOnlyMode$ | async) ? 'text-only' : 'image-card'
  ]"
  class="card"
  [class.mat-elevation-z2]="true"
>
  <ng-container *ngIf="textOnlyMode$ | async; else imageMode">
    <div class="text-only-body" dir="auto">
      <div class="card-name" dir="auto">{{ card.name }}</div>
    </div>
  </ng-container>

  <ng-template #imageMode>
    <img
      class="main-img"
      [src]="imageSrc()"
      [alt]="card.name"
      loading="lazy"
      (error)="onImageError($event)"
    />
    <div class="card-name" dir="auto">{{ card.name }}</div>
  </ng-template>
</div>
