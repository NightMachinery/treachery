<div class="wrapper surface-panel--soft" *ngIf="guess && guess.murdererUid">
  <div class="guess-copy">
    <p class="eyebrow">Accusation</p>
    <h3>Compose a guess</h3>
    <p class="muted-copy">Select a suspect, then pick one means card and one clue card from that same deck.</p>
  </div>

  <div class="container">
    <ng-container *ngIf="gameApi.players$ | async as players">
      <ng-container *ngIf="getMurderer(players) as murderer">
        <div class="murderer">
          <div class="think">I think</div>
          <tg-avatar [diameter]="52" [uid]="murderer.uid" [name]="murderer.name"></tg-avatar>
          <div class="name">{{ murderer.name }}</div>
          <div class="subtitle">is the murderer</div>
        </div>
        <ng-container *ngIf="getMeansCard(murderer) as meansCard">
          <app-card [card]="meansCard" [means]="true"></app-card>
        </ng-container>
        <div class="selection-placeholder" *ngIf="!getMeansCard(murderer)">
          <div class="placeholder-label">Means</div>
          <div class="placeholder-copy">Pick a means card</div>
        </div>

        <ng-container *ngIf="getClueCard(murderer) as clueCard; else cluePlaceholder">
          <app-card [card]="clueCard" [means]="false"></app-card>
        </ng-container>
        <ng-template #cluePlaceholder>
          <div class="selection-placeholder">
            <div class="placeholder-label">Clue</div>
            <div class="placeholder-copy">Pick a clue card</div>
          </div>
        </ng-template>

        <div class="button-container">
          <button mat-stroked-button type="button" (click)="cancelGuess()">Cancel</button>
          <button mat-raised-button color="accent" (click)="makeGuess()" [disabled]="!guess?.meansCardId || !guess?.clueCardId">
            Make guess
          </button>
        </div>
      </ng-container>
    </ng-container>
  </div>
</div>
